<style>

html,body{margin:0}

.brand{display:flex;align-items:center;gap:10px}

.brand h1{font-size:17px;margin:0;line-height:1.2}
.brand small{display:block;color:var(--muted);font-weight:600;font-size:12.5px}
nav.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 0;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font:700 13.5px 'Nunito',sans-serif;color:var(--muted);cursor:pointer;white-space:nowrap}
.tab .n{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--accent2);color:var(--accent-d);font-size:12px;margin-right:5px}
.tab.on{background:var(--accent);border-color:var(--accent);color:#fff}
.tab.on .n{background:#fff;color:var(--accent-d)}

main{max-width:880px;margin:0 auto;padding:14px 14px 110px}
.stephead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 10px;flex-wrap:wrap}
.stephead .lab{font-weight:800;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-d)}

.ctrl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}

.piece.right{border-color:var(--ok);background:#e6f5ec}
.piece.wrong{border-color:var(--bad);background:#fbeaea}
input[type=range]{width:100%;accent-color:var(--accent);height:34px}
.tval{font-size:28px;font-weight:800;text-align:center;color:#24405a}
.snaps{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}

.snap svg{width:100%;height:auto}
.substep{display:flex;align-items:center;gap:10px;margin:6px 0}
.substep .cnt{font-weight:800;color:var(--muted);font-size:14px}
.caption{min-height:52px;font-weight:600;background:#f7faf5;border-radius:10px;padding:10px 12px;margin:6px 0}
.bars{display:flex;flex-direction:column;gap:9px;margin:10px 0}
.bar{display:grid;grid-template-columns:52px 1fr 78px;align-items:center;gap:8px;font-weight:700}

.ovc{border-radius:14px;padding:12px;border:2px solid}
.ovc.p{border-color:#efb7b4;background:#fdf6f5}
.ovc.t{border-color:#b7d0ef;background:#f4f8fd}
.ovc h4{margin:0 0 4px;font-size:16px}
.ovc .arrow{font-size:20px;text-align:center;margin:4px 0}
.ovc .res{font-weight:800;text-align:center;padding:6px;border-radius:10px;background:#fff}
.strength{display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px;margin:6px 0 0}
.strength .grad{flex:1;height:10px;border-radius:6px;background:linear-gradient(90deg,#8bb6e6,#d64541)}
.qn{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:12px 0;background:#fcfdfb}
.qn .qh{font-weight:800}
.score{font-size:20px;font-weight:800;text-align:center;padding:14px;border-radius:14px;background:var(--accent2);margin-top:16px}
details{background:#fffdf4;border:1px solid #f0e2b0;border-radius:12px;padding:10px 14px;margin:12px 0}
summary{font-weight:800;cursor:pointer}
footer.nav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);border-top:1px solid var(--line);z-index:10;padding:10px 14px calc(10px + env(safe-area-inset-bottom))}
footer.nav .w{max-width:880px;margin:0 auto;display:flex;gap:10px;justify-content:space-between}

.donebar{background:#e6f5ec;border:1.5px solid #9fd3b4;color:#1f6b43;border-radius:10px;padding:8px 12px;font-weight:700;font-size:14.5px;margin:0 0 12px}
.dots button.solved{background:var(--ok)}
.savebox{border:2px solid #b7d0ef;background:#f4f8fd;border-radius:14px;padding:12px 14px;margin:16px 0}
.savebox input[type=text]{font:600 16px 'Nunito',sans-serif;padding:10px 12px;border-radius:10px;border:2px solid var(--line);width:100%;max-width:360px;min-height:44px}
.savebox textarea{width:100%;min-height:150px;font:14px ui-monospace,Menlo,monospace;border-radius:10px;border:1px solid var(--line);padding:8px;margin-top:8px}
.prog{font-size:15px;margin:6px 0;padding-left:20px}
#savenote{font-weight:700}
.src{font-size:12.5px;color:var(--muted);text-align:center;margin-top:18px}
@media (min-width:760px){
  .hwrap,main,footer.nav .w{max-width:1180px}
  main{padding-left:22px;padding-right:22px}
  section.step.two{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);grid-template-rows:repeat(30,auto) 1fr;column-gap:28px;align-items:start}
  section.step.two>*{grid-column:2}

  .cmp td{font-size:13.5px}

}
</style>

<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <radialGradient id="gcloud"><stop offset="0" stop-color="#2b7bd6" stop-opacity=".42"/><stop offset=".7" stop-color="#2b7bd6" stop-opacity=".12"/><stop offset="1" stop-color="#2b7bd6" stop-opacity="0"/></radialGradient>
    <radialGradient id="gcloud2"><stop offset="0" stop-color="#7fb3ea" stop-opacity=".75"/><stop offset=".65" stop-color="#9cc5f0" stop-opacity=".45"/><stop offset="1" stop-color="#b9d6f5" stop-opacity="0"/></radialGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5862"/></marker>

</svg>

<header>
  <div class="hwrap">
    <div class="brand"><div class="logo">δ±</div><div><h1>Zwischenmolekulare Kräfte</h1><small>Chemie 9 · Realschule Bayern (Zweig I)</small></div></div>

  <p class="src">Grundlage: Chemie Realschule Bayern 9 I, S. 32 („Permanente Dipole“, „Dipol-Dipol-Wechselwirkung“, „London-Dispersionskräfte“)</p>

<script>
/* ================= Hilfsfunktionen ================= */
const $=(s,el=document)=>el.querySelector(s);
const $$=(s,el=document)=>Array.from(el.querySelectorAll(s));
let loops=[],timers=[];
function loop(fn){let alive=true,last=performance.now(),id;
  const f=t=>{if(!alive)return;const dt=Math.min(.05,(t-last)/1000);last=t;fn(dt,t/1000);id=requestAnimationFrame(f);};
  id=requestAnimationFrame(f);const stop=()=>{alive=false;cancelAnimationFrame(id)};loops.push(stop);return stop;}
function later(fn,ms){const id=setTimeout(fn,ms);timers.push(id);return id;}
function every(fn,ms){const id=setInterval(fn,ms);timers.push(id);return id;}
function clearAll(){loops.forEach(s=>s());loops=[];timers.forEach(id=>{clearTimeout(id);clearInterval(id)});timers=[];}
function cv(c,W,H){const d=Math.max(2,Math.min(3,window.devicePixelRatio||1));c.width=W*d;c.height=H*d;const x=c.getContext('2d');x.setTransform(d,0,0,d,0,0);return x;}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const KEY='zmk-lernpfad-v1';
let DB={cur:{s:0,p:0},seen:{},solved:{},quiz:null,name:''};
try{const r=localStorage.getItem(KEY);if(r)DB=Object.assign(DB,JSON.parse(r));}catch(e){}
let storageOK=true;
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB));}catch(e){storageOK=false;}
  const n=document.getElementById('savenote');if(n)n.textContent=storageOK?'💾 Fortschritt gespeichert ('+new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})+' Uhr)':'⚠️ Speichern ist in diesem Browser nicht möglich (z. B. privater Modus).';}
function show(el){if(typeof el==='string')el=$(el);if(!el)return;el.classList.remove('hidden');el.classList.add('reveal');
  if(el.id&&/^after/.test(el.id)&&typeof cur!=='undefined'){const k=cur.s+'-'+cur.p;if(!DB.solved[k]){DB.solved[k]=true;save();markDots();}}}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const noise=(t,p)=>(Math.sin(1.3*t+p)+.7*Math.sin(2.9*t+2.1*p)+.5*Math.sin(5.3*t+3.7*p))/2.2;
function seeVis(el){if(window.innerWidth>=760)return;const v=$('.vis .stage',el)||$('.stage',el);if(!v)return;const r=v.getBoundingClientRect(),hh=$('header').offsetHeight;if(r.top<hh+4||r.bottom>innerHeight-80)v.scrollIntoView({behavior:'smooth',block:'center'});}
function setHH(){document.documentElement.style.setProperty('--hh',$('header').offsetHeight+'px');}
window.addEventListener('resize',setHH);
function setT(el,x,y){el.style.transform=`translate(${x}px,${y}px)`;}

/* Multiple Choice: opts=[{t,ok,fb}] ; prediction=true -> jede Antwort wird akzeptiert */
function mc(el,opts,onDone,prediction){
  const w=document.createElement('div');w.className='mc';
  const fb=document.createElement('div');fb.className='fb';
  opts.forEach(o=>{const b=document.createElement('button');b.className='opt';b.innerHTML=o.t;
    b.onclick=()=>{
      if(prediction){$$('.opt',w).forEach(x=>x.disabled=true);b.classList.add('chosen');onDone&&onDone(o);return;}
      if(o.ok){b.classList.add('right');$$('.opt',w).forEach(x=>x.disabled=true);fb.className='fb ok';fb.innerHTML='✔ '+(o.fb||'Richtig!');onDone&&onDone(o);}
      else{b.classList.add('wrong');b.disabled=true;fb.className='fb bad';fb.innerHTML='✘ '+(o.fb||'Noch nicht – versuch es nochmal!');w.dataset.miss='1';}
    };w.appendChild(b);});
  w.appendChild(fb);el.appendChild(w);return w;}

/* Canvas-Zeichenhilfen */
function atom(ctx,x,y,r,k,l){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);
  ctx.fillStyle=k==='p'?'#f8d6d4':k==='n'?'#d3e4f8':'#e5e8eb';ctx.fill();ctx.lineWidth=1.6;
  ctx.strokeStyle=k==='p'?'#d64541':k==='n'?'#2b7bd6':'#8a949c';ctx.stroke();
  if(l){ctx.fillStyle='#24303a';ctx.font=`800 ${r>10?11:9}px Nunito,sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(l,x,y+.5);}}
function txt(ctx,s,x,y,col,size,al){ctx.fillStyle=col;ctx.font=`800 ${size}px Nunito,sans-serif`;ctx.textAlign=al||'center';ctx.textBaseline='middle';ctx.fillText(s,x,y);}

{t:'Polare Atombindung',f(el){
  el.innerHTML=`
  <h2>Erinnerung: die polare Atombindung</h2>
  <p>Im <b>Chlorwasserstoff-Molekül HCl</b> teilen sich ein H-Atom und ein Cl-Atom ein bindendes Elektronenpaar. Die beiden Atome ziehen aber unterschiedlich stark an diesem Elektronenpaar. Wie stark ein Atom die Bindungselektronen anzieht, gibt die <b>Elektronegativität (EN)</b> an.</p>
  <div class="vis"><div class="stage"><svg viewBox="0 0 400 180" id="sv">
    <circle cx="115" cy="90" r="28" class="aH"/><circle cx="285" cy="90" r="42" class="aCl"/>

      <circle cx="196" cy="82" r="5.5" class="e"><animateMotion path="M0,0 a5,3 0 1,0 9,1 a4,4 0 1,0 -9,-1" dur="0.8s" repeatCount="indefinite"/></circle><circle cx="196" cy="98" r="5.5" class="e"><animateMotion path="M0,0 a4,4 0 1,1 9,-1 a5,3 0 1,1 -9,1" dur="1.05s" repeatCount="indefinite"/></circle></g>
    <text x="115" y="90" class="sym">H</text><text x="285" y="90" class="sym">Cl</text>
    <text x="115" y="150" class="en">EN 2,2</text><text x="285" y="158" class="en">EN 3,2</text>
    <text x="115" y="44" class="dl pos">δ+</text><text x="285" y="34" class="dl neg">δ−</text>

  <div class="task"><div class="task-h">✏️ Du bist dran</div><p>Chlor hat die größere Elektronegativität. Wohin wird das bindende Elektronenpaar verschoben? Tippe auf deine Antwort – dann siehst du es in der Animation.</p><div id="q"></div></div>
  <div id="after" class="hidden">
    <p>Das Cl-Atom zieht das Elektronenpaar stärker zu sich. Dort gibt es jetzt etwas „zu viel“ negative Ladung: eine <b class="neg">negative Partialladung δ−</b> (sprich: „delta minus“). Beim H-Atom fehlt etwas negative Ladung: <b class="pos">positive Partialladung δ+</b>.</p>
    <p><b>Partialladung</b> heißt <i>Teilladung</i> – es ist keine ganze Ladung wie bei einem Ion, sondern nur ein „bisschen“.</p>
    <div class="merk">Eine Atombindung zwischen Atomen mit unterschiedlicher Elektronegativität ist eine <b>polare Atombindung</b>. Das Atom mit der größeren EN erhält die Partialladung δ−, das andere δ+.</div>

{t:'Ladungsschwerpunkte',f(el){
  el.innerHTML=`
  <h2>Ladungsschwerpunkte – und was ein Dipol ist</h2>
  <p>Stell dir vor, du sammelst alle positiven Partialladungen eines Moleküls an <b>einem einzigen Punkt</b>. Diesen Punkt nennt man den <b class="pos">positiven Ladungsschwerpunkt</b>. Genauso gibt es einen <b class="neg">negativen Ladungsschwerpunkt</b> für alle negativen Partialladungen.</p>
  <div class="vis"><div class="stage"><svg viewBox="0 0 400 190" id="sv">
    <line x1="130" y1="95" x2="252" y2="95" class="bond"/>
    <circle cx="115" cy="95" r="28" class="aH"/><circle cx="285" cy="95" r="42" class="aCl"/>
    <text x="115" y="95" class="sym">H</text><text x="285" y="95" class="sym">Cl</text>
    <text x="115" y="50" class="dl pos vis">δ+</text><text x="285" y="40" class="dl neg vis">δ−</text>
    <g id="cs" class="fade" style="opacity:0">
      <circle cx="115" cy="95" r="9" fill="#d64541"><animate attributeName="r" values="8;11;8" dur="1.4s" repeatCount="indefinite"/></circle>
      <circle cx="285" cy="95" r="9" fill="#2b7bd6"><animate attributeName="r" values="8;11;8" dur="1.4s" repeatCount="indefinite"/></circle>
    </g>
    <g id="poles" class="fade" style="opacity:0">
      <line x1="115" y1="160" x2="285" y2="160" stroke="#4b5862" stroke-width="2" marker-start="url(#arr)" marker-end="url(#arr)"/>
      <text x="200" y="178" class="en" style="fill:#24405a">2 Pole → Dipol</text>
      <text x="115" y="140" class="en" style="fill:#d64541">Pluspol</text><text x="285" y="148" class="en" style="fill:#2b7bd6">Minuspol</text>
    </g>
  </svg></div>
  <p class="legend"><span class="dot pos"></span>positiver Ladungsschwerpunkt <span class="dot neg"></span>negativer Ladungsschwerpunkt</p>
  <div class="ctrl"><button class="btn" id="b1">① Ladungsschwerpunkte einzeichnen</button><button class="btn" id="b2" disabled>② Pole zeigen</button></div></div>
  <div id="after" class="hidden">
    <p>Beim HCl-Molekül ist das einfach: Es gibt nur ein δ+ (am H) und ein δ− (am Cl). Die Ladungsschwerpunkte liegen also an den beiden Enden des Moleküls.</p>
    <p>Ein Molekül mit einem positiven und einem negativen „Ende“ nennt man <b>Dipol</b> (<i>di</i> = zwei, <i>Pol</i> = Ende) – ähnlich wie ein Magnet mit Nord- und Südpol.</p>
    <div class="task"><div class="task-h">✏️ Denk mit</div><p>Fallen beim HCl-Molekül der positive und der negative Ladungsschwerpunkt zusammen (liegen sie am selben Ort)?</p><div id="q"></div></div>
  </div>`;
  $('#b1',el).onclick=()=>{seeVis(el);$('#cs',el).style.opacity=1;$('#b2',el).disabled=false;};
  $('#b2',el).onclick=()=>{$('#poles',el).style.opacity=1;show($('#after',el));};

    {t:'Nein, sie liegen an verschiedenen Stellen.',ok:true,fb:'Richtig! Sie liegen an den beiden Enden – HCl ist ein Dipol.'}]);
}},
{t:'Ammoniak NH₃',f(el){
  el.innerHTML=`
  <h2>Ammoniak: drei polare Bindungen</h2>
  <p>Im Ammoniak-Molekül NH₃ ist das N-Atom (EN 3,0) mit drei H-Atomen (EN 2,2) verbunden. Jede N–H-Bindung ist polar: Das N-Atom trägt δ−, jedes H-Atom trägt δ+. Das Molekül ist wie eine <b>Pyramide</b> gebaut: N an der Spitze, die drei H-Atome bilden die Grundfläche. Zwischen den Bindungen liegt ein Winkel von 107°.</p>
  <div class="vis"><div class="stage"><svg viewBox="0 0 400 275" id="sv">
    <line x1="200" y1="75" x2="95" y2="170" class="bond"/><line x1="200" y1="75" x2="305" y2="170" class="bond"/><line x1="200" y1="75" x2="200" y2="225" class="bond"/>
    <path d="M168 104 Q200 120 232 104" fill="none" stroke="#8a949c" stroke-width="1.5" stroke-dasharray="3 3"/>
    <text x="200" y="133" class="en" style="font-size:12px">107°</text>
    <line x1="188" y1="36" x2="212" y2="36" stroke="#24303a" stroke-width="3" stroke-linecap="round"/>
    <circle cx="200" cy="75" r="27" class="aN"/><text x="200" y="75" class="sym">N</text>
    <circle cx="95" cy="170" r="20" class="aH"/><text x="95" y="170" class="sym">H</text>
    <circle cx="305" cy="170" r="20" class="aH"/><text x="305" y="170" class="sym">H</text>
    <circle cx="200" cy="225" r="20" class="aH"/><text x="200" y="225" class="sym">H</text>
    <text x="245" y="52" class="dl neg vis">δ−</text>
    <text x="60" y="170" class="dl pos vis">δ+</text><text x="340" y="170" class="dl pos vis">δ+</text><text x="235" y="250" class="dl pos vis">δ+</text>
    <g id="glows">
      <circle class="mv" cx="95" cy="170" r="10" fill="#d64541" opacity="0"/>
      <circle class="mv" cx="305" cy="170" r="10" fill="#d64541" opacity="0"/>
      <circle class="mv" cx="200" cy="225" r="10" fill="#d64541" opacity="0"/>
    </g>
    <circle id="negc" class="fade" cx="200" cy="75" r="10" fill="#2b7bd6" style="opacity:0"/>
    <g id="cands">
      <g data-k="A" style="cursor:pointer"><circle cx="200" cy="75" r="34" fill="transparent" stroke="#e8a23a" stroke-width="2.5" stroke-dasharray="5 4"/><text x="150" y="30" class="sym" style="fill:#c07a10">A</text></g>
      <g data-k="B" style="cursor:pointer"><circle cx="200" cy="188" r="14" fill="#fff4e2" stroke="#e8a23a" stroke-width="2.5" stroke-dasharray="5 4"/><text x="200" y="188" class="sym" style="fill:#c07a10;font-size:14px">B</text></g>
      <g data-k="C" style="cursor:pointer"><circle cx="95" cy="170" r="27" fill="transparent" stroke="#e8a23a" stroke-width="2.5" stroke-dasharray="5 4"/><text x="55" y="135" class="sym" style="fill:#c07a10">C</text></g>
    </g>
    <g id="dline" class="fade" style="opacity:0"><line x1="200" y1="88" x2="200" y2="176" stroke="#8e44ad" stroke-width="2.5" stroke-dasharray="4 4"/></g>
  </svg></div></div>
  <div class="task"><div class="task-h">✏️ Du bist dran</div><p>Wo liegt der <b class="pos">positive Ladungsschwerpunkt</b>? Tippe in der Abbildung auf <b>A</b>, <b>B</b> oder <b>C</b>.</p><div class="fb" id="fb"></div></div>
  <div id="after" class="hidden">
    <p>Die drei positiven Partialladungen „treffen sich“ in der Mitte der Grundfläche – <b>unterhalb</b> des N-Atoms. Der negative Ladungsschwerpunkt liegt beim N-Atom. Die beiden Schwerpunkte fallen also <b>nicht zusammen</b>.</p>
    <p>➜ Das Ammoniak-Molekül ist ein <b>Dipol</b>. Weil seine Partialladungen immer bestehen, spricht man von einem <b>permanenten Dipol</b> (<i>permanent</i> = dauerhaft).</p>
  </div>`;
  const fb=$('#fb',el);let done=false;
  $$('#cands g',el).forEach(g=>g.onclick=()=>{if(done)return;const k=g.dataset.k;
    if(k==='B'){done=true;seeVis(el);fb.className='fb ok';fb.innerHTML='✔ Richtig! Schau, wie sich die drei δ+ in der Mitte vereinen.';
      $('#cands',el).style.display='none';
      const gl=$$('#glows circle',el);const pts=[[95,170],[305,170],[200,225]];
      gl.forEach(c=>c.setAttribute('opacity','.85'));
      later(()=>gl.forEach((c,i)=>setT(c,200-pts[i][0],188-pts[i][1])),400);
      later(()=>{$('#negc',el).style.opacity=1;},1900);
      later(()=>{$('#dline',el).style.opacity=1;show($('#after',el));},2500);
    }else if(k==='A'){fb.className='fb bad';fb.innerHTML='✘ Am N-Atom sitzt die <b class="neg">negative</b> Partialladung – dort liegt der negative Ladungsschwerpunkt.';}
    else{fb.className='fb bad';fb.innerHTML='✘ Es gibt <b>drei</b> H-Atome mit δ+. Der Schwerpunkt muss in der Mitte zwischen allen dreien liegen.';}
  });
}},
{t:'Kohlenstoffdioxid CO₂',f(el){
  el.innerHTML=`
  <h2>Kohlenstoffdioxid: polar – aber ein Dipol?</h2>
  <p>Im CO₂-Molekül ist das C-Atom (EN 2,5) mit zwei O-Atomen (EN 3,5) über Doppelbindungen verbunden. Beide C=O-Bindungen sind <b>polar</b>. Das Molekül ist <b>linear</b> (gerade) gebaut.</p>
  <div class="vis"><div class="stage"><button class="btn sec hidden" id="again" style="position:absolute;top:8px;right:8px;padding:5px 10px;min-height:0;font-size:13px;z-index:2">↺ nochmal</button><svg viewBox="0 0 400 252" id="sv">
    <rect id="frame" x="34" y="24" width="332" height="150" rx="44" fill="none" stroke="#8e44ad" stroke-width="2.5" stroke-dasharray="7 6" style="opacity:0" class="fade"/>
    <text id="ftxt" x="200" y="16" class="en fade" style="fill:#8e44ad;opacity:0;font-size:14px;font-weight:800">von außen: keine Pole</text>
    <line x1="110" y1="93" x2="176" y2="93" class="bond"/><line x1="110" y1="107" x2="176" y2="107" class="bond"/>
    <line x1="224" y1="93" x2="290" y2="93" class="bond"/><line x1="224" y1="107" x2="290" y2="107" class="bond"/>
    <circle cx="80" cy="100" r="30" class="aO"/><text x="80" y="100" class="sym">O</text>
    <circle cx="200" cy="100" r="26" class="aC"/><text x="200" y="100" class="sym">C</text>
    <circle cx="320" cy="100" r="30" class="aO"/><text x="320" y="100" class="sym">O</text>
    <g id="cl1"><ellipse cx="0" cy="100" rx="30" ry="20" fill="url(#gcloud)"/></g>
    <g id="cl2"><ellipse cx="0" cy="100" rx="30" ry="20" fill="url(#gcloud)"/></g>
    <circle id="g1" cx="80" cy="100" r="11" fill="#2b7bd6" opacity="0"/><circle id="g2" cx="320" cy="100" r="11" fill="#2b7bd6" opacity="0"/>
    <text id="d1" x="80" y="52" class="dl neg">δ−</text><text id="d0" x="200" y="56" class="dl pos">δ+</text><text id="d2" x="320" y="52" class="dl neg">δ−</text>
    <line id="k1" y1="100" x2="80" y2="100" stroke="#2b7bd6" stroke-width="2" stroke-dasharray="4 4" opacity="0"/>
    <line id="k2" y1="100" x2="320" y2="100" stroke="#2b7bd6" stroke-width="2" stroke-dasharray="4 4" opacity="0"/>
    <circle id="cp" cx="200" cy="100" r="9" fill="#d64541" opacity="0"/>
    <circle id="mix" cx="200" cy="100" r="17" fill="none" stroke="#8e44ad" stroke-width="3" opacity="0"/>
    <circle id="cn" cy="100" r="9" fill="#2b7bd6" stroke="#fff" stroke-width="2" opacity="0"/>
    <g id="meter" opacity="0">
      <text x="200" y="196" class="en" style="font-size:12.5px;fill:#24405a;font-weight:800">Lage des negativen Schwerpunkts</text>
      <line x1="90" y1="218" x2="310" y2="218" stroke="#9aa5ae" stroke-width="3" stroke-linecap="round"/>
      <line x1="200" y1="209" x2="200" y2="227" stroke="#8e44ad" stroke-width="2.5"/>
      <text x="90" y="242" class="en" style="font-size:11.5px">links</text><text x="200" y="242" class="en" style="font-size:11.5px;fill:#8e44ad;font-weight:800">Mitte (C)</text><text x="310" y="242" class="en" style="font-size:11.5px">rechts</text>
      <path id="needle" d="M0,0 l-8,-13 h16 z" fill="#2b7bd6"/>
    </g>
  </svg></div>
  <div class="caption" id="cap">Die beiden C=O-Bindungen mit ihren Bindungselektronen (blau).</div>
  <p class="legend"><span class="dot pos"></span>positiver <span class="dot neg"></span>negativer Ladungsschwerpunkt <span class="dot mix"></span>fallen zusammen</p>
  </div>
  <div class="task"><div class="task-h">🤔 Deine Vermutung</div><p>Ist das CO₂-Molekül ein Dipol? Entscheide dich – danach siehst du die Auflösung als Animation.</p><div id="q"></div></div>
  <div id="after" class="hidden">
    <div class="fb" id="pfb"></div>
    <p>Beide O-Atome ziehen die Bindungselektronen zu sich – beide tragen δ−. Durch die ständige Bewegung der Elektronen wird der negative Ladungsschwerpunkt <b>mal etwas nach links, mal etwas nach rechts</b> verschoben. Weil beide O-Atome <b>gleich stark</b> ziehen und <b>symmetrisch</b> liegen, gleicht sich das aus: Im Mittel liegt der negative Schwerpunkt genau beim C-Atom – dort, wo auch der positive Schwerpunkt liegt. <b>Die Ladungsschwerpunkte fallen zusammen.</b></p>
    <p>Das ist wie beim <b>Tauziehen</b> mit zwei gleich starken Mannschaften: Das Seil ruckelt hin und her, bleibt aber in der Mitte.</p>
    <p>➜ Von außen betrachtet hat CO₂ kein Plus- und kein Minus-Ende, also <b>keine Pole</b>. CO₂ hat zwar polare Bindungen, ist aber <b>kein Dipol</b>.</p>
  </div>`;
  const sv=$('#sv',el),g=id=>$('#'+id,sv),cap=$('#cap',el);
  const CAP=['Die beiden C=O-Bindungen mit ihren Bindungselektronen (blau).',
    '① Die O-Atome haben die größere EN: Beide ziehen die Bindungselektronen zu sich.',
    '② Beide O-Atome tragen jetzt δ−, das C-Atom trägt δ+. Der positive Schwerpunkt liegt am C-Atom (rot).',
    '③ Beide O-Atome ziehen am negativen Schwerpunkt (blau) – mal ist er etwas links, mal etwas rechts. Er pendelt hin und her …',
    '④ … und bleibt im Mittel genau beim C-Atom: Positiver und negativer Schwerpunkt fallen zusammen. Von außen hat das Molekül keine Pole!'];
  const clouds=[g('cl1'),g('cl2')].map(c=>{const ds=[];for(let i=0;i<4;i++){const d=document.createElementNS('http://www.w3.org/2000/svg','circle');d.setAttribute('r','3.6');d.setAttribute('class','e');c.appendChild(d);ds.push({el:d,ph:Math.random()*6,sp:4+Math.random()*4,bx:(i%2?6:-6),by:(i<2?-6:6)});}return {g:c,ds};});
  let t0=null,lastCap=-1;
  const vis=(id,on)=>{const e=g(id);if(e.tagName==='text')e.classList.toggle('vis',on);else e.setAttribute('opacity',on?(id[0]==='g'?.35:1):0);};
  loop((dt,ts)=>{
    const t=t0==null?-1:(performance.now()-t0)/1000;
    const sh=t<0?0:22*(t<1.8?(1-Math.cos(Math.PI*t/1.8))/2:1);
    let d=0;if(t>=4){const tc=t-4;const A=7+48*Math.exp(-tc*.4);d=A*Math.sin(tc*3.1)*(1+.25*Math.sin(tc*1.7));}
    const cx=[143-sh+d*.35,257+sh+d*.35];
    clouds.forEach((c,i)=>{c.g.setAttribute('transform',`translate(${cx[i]},0)`);
      c.ds.forEach(o=>{o.el.setAttribute('cx',o.bx+4*Math.sin(ts*o.sp+o.ph));o.el.setAttribute('cy',100+o.by+3*Math.cos(ts*o.sp*1.3+o.ph));});});
    if(t<0)return;
    let ph=t<1?0:t<2.4?1:t<4?2:t<9.5?3:4;
    if(ph!==lastCap){lastCap=ph;cap.innerHTML=CAP[ph];}
    ['d1','d2'].forEach(id=>vis(id,t>1.5));vis('d0',t>2);vis('g1',t>2);vis('g2',t>2);vis('cp',t>2.6);
    const on=t>=4,x=200+d;
    g('cn').setAttribute('cx',x);g('cn').setAttribute('opacity',on?1:0);
    ['k1','k2'].forEach(id=>{g(id).setAttribute('x1',x);g(id).setAttribute('opacity',on?.8:0);});
    g('meter').setAttribute('opacity',on?1:0);g('needle').setAttribute('transform',`translate(${200+d*1.8},216)`);
    g('mix').setAttribute('opacity',on&&Math.abs(d)<5?1:0);
    g('frame').style.opacity=t>9.5?1:0;g('ftxt').style.opacity=t>9.5?1:0;
  });
  const start=()=>{t0=performance.now();lastCap=-1;};
  $('#again',el).onclick=()=>{seeVis(el);start();};
  mc($('#q',el),[{t:'Ja, es hat ja polare Bindungen.',v:'ja'},{t:'Nein.',v:'nein'},{t:'Kann man nicht sagen.',v:'?'}],o=>{
    const pfb=$('#pfb',el);
    pfb.className='fb '+(o.v==='nein'?'ok':'neutral');
    pfb.innerHTML=o.v==='nein'?'✔ Deine Vermutung stimmt!':'💡 Überraschung! Schau dir an, warum CO₂ trotzdem kein Dipol ist.';
    seeVis(el);later(start,400);
    later(()=>{show($('#after',el));show($('#again',el));},10000);
  },true);
}},
{t:'Experiment: elektrisches Feld',f(el){
  const ST={HCl:{n:'HCl',dip:true},H2O:{n:'H₂O',dip:true},CO2:{n:'CO₂',dip:false},O2:{n:'O₂',dip:false}};
  el.innerHTML=`
  <h2>Experiment: Moleküle im elektrischen Feld</h2>
  <p>Zwischen zwei geladenen Metallplatten entsteht ein <b>elektrisches Feld</b>: links die positiv (+), rechts die negativ (−) geladene Platte. Was machen die Moleküle, wenn man die Spannung einschaltet?</p>

    ${Object.keys(ST).map(k=>`<tr><td><b>${ST[k].n}</b></td><td><select data-k="${k}"><option value="">– wähle –</option><option value="ja">ja</option><option value="nein">nein</option></select></td></tr>`).join('')}

    <div id="after2" class="hidden"><p>Die negativ geladene Seite (δ−) eines Dipols wird von der Plusplatte angezogen, die positive Seite (δ+) von der Minusplatte. Deshalb drehen sich Dipole im elektrischen Feld. Bei CO₂ und O₂ gibt es keine getrennten Pole – sie drehen sich weiter zufällig.</p>

  </div>`;
  const c=$('#c',el),W=440,H=300,ctx=cv(c,W,H);let cur='HCl',field=false;
  const ms=[];for(let r=0;r<3;r++)for(let k=0;k<4;k++)ms.push({x:78+k*96+(Math.random()-.5)*12,y:58+r*92+(Math.random()-.5)*12,a:Math.random()*6.28,w:(Math.random()-.5)*2,ph:Math.random()*6});

  const sp=$('#sp',el);sp.onclick=()=>{field=!field;sp.textContent=field?'⏻ Spannung ausschalten':'⚡ Spannung einschalten';sp.classList.toggle('on',field);};
  function drawMol(m){const ux=Math.cos(m.a),uy=Math.sin(m.a),px=-uy,py=ux,x=m.x+3*Math.sin(m.t*1.7+m.ph),y=m.y+3*Math.cos(m.t*1.3+m.ph);

    else if(cur==='CO2'){atom(ctx,x+ux*21,y+uy*21,12,'n','O');atom(ctx,x-ux*21,y-uy*21,12,'n','O');atom(ctx,x,y,11,'p','C');}
    else{atom(ctx,x+ux*10,y+uy*10,12,'g','O');atom(ctx,x-ux*10,y-uy*10,12,'g','O');}}
  loop((dt,t)=>{
    const dip=ST[cur].dip;
    ms.forEach(m=>{m.t=t;
      if(field&&dip){let d=Math.PI-m.a;d=Math.atan2(Math.sin(d),Math.cos(d));m.w+=(d*7-m.w*3.2)*dt+(Math.random()-.5)*6*dt;}
      else{m.w+=(Math.random()-.5)*9*dt;m.w=clamp(m.w,-2.2,2.2);}

    if(field){ctx.strokeStyle='rgba(120,130,140,.25)';ctx.lineWidth=1;ctx.setLineDash([4,6]);ctx.lineDashOffset=-t*20;
      for(let y=30;y<H-20;y+=46){ctx.beginPath();ctx.moveTo(32,y);ctx.lineTo(W-32,y);ctx.stroke();}ctx.setLineDash([]);}

  $('#chk',el).onclick=()=>{let ok=true,empty=false;

    {t:'Weil nur HCl und H₂O permanente Dipole sind – ihre Pole werden von den geladenen Platten angezogen.',ok:true,fb:'Genau!'},
    {t:'Weil nur HCl und H₂O polare Bindungen haben.',ok:false,fb:'Auch CO₂ hat polare Bindungen – aber seine Ladungsschwerpunkte fallen zusammen.'}],()=>show($('#after2',el)));
}},

{t:'Gegensätze ziehen sich an',f(el){

    <p>In einem Stoff gibt es sehr viele Moleküle. Sie ordnen sich so an, dass sich möglichst oft δ+ und δ− gegenüberstehen:</p>
    <div class="stage"><svg viewBox="0 0 400 130" id="chain"></svg></div>

  const sv=$('#sv',el);let ang=180,cx=305,busy=false,found=false;

  function place(a,c){const r=a*Math.PI/180,ux=Math.cos(r),uy=Math.sin(r),px=uy,py=-ux;

    P.lb.setAttribute('x',c);const le=Math.min(hx-18,lx-28);P.lnk.setAttribute('x2',le-3);}
  function status(){const s=((ang%360)+360)%360;

    ms.forEach(m=>{s+=`<line x1="${m.hx}" y1="${m.hy}" x2="${m.cx}" y2="${m.cy}" class="bond"/><circle cx="${m.hx}" cy="${m.hy}" r="11" class="aH"/><text x="${m.hx}" y="${m.hy}" class="sym" style="font-size:12px">H</text><circle cx="${m.cx}" cy="${m.cy}" r="17" class="aCl"/><text x="${m.cx}" y="${m.cy}" class="sym" style="font-size:13px">Cl</text><text x="${m.hx}" y="${m.hy-19}" class="dl pos vis" style="font-size:14px">δ+</text><text x="${m.cx}" y="${m.cy-24}" class="dl neg vis" style="font-size:14px">δ−</text>`;});

{t:'Simulation: Erwärmen',f(el){
  el.innerHTML=`
  <h2>Simulation: Was passiert beim Erwärmen?</h2>
  <p>Beim Erwärmen bewegen sich die Teilchen immer schneller. Wenn sie schnell genug sind, können sie sich voneinander lösen – der Stoff siedet. Vergleiche Sauerstoff und Chlorwasserstoff.</p>
  <div class="vis"><div class="stage"><canvas id="c"></canvas></div>
  <div class="tval" id="tv">−200 °C</div>
  <input type="range" id="tr" min="-230" max="-60" step="1" value="-200" aria-label="Temperatur">
  <p class="legend"><span class="dot" style="background:#2e8b57"></span> Dipol-Dipol-Wechselwirkungen zwischen HCl-Molekülen</p></div>
  <div class="task"><div class="task-h">✏️ Du bist dran</div><p>Stelle mit dem Regler eine Temperatur ein, bei der <b>Sauerstoff schon gasförmig</b> ist, <b>Chlorwasserstoff aber noch nicht</b>.</p><div class="fb" id="fb"></div></div>
  <div id="after" class="hidden"><div class="task"><div class="task-h">✏️ Was schließt du daraus?</div><div id="q"></div></div></div>`;
  const c=$('#c',el),W=440,H=300,ctx=cv(c,W,H);let T=-200;
  const B=[{n:'Sauerstoff O₂',tm:-219,tb:-183,dip:false,x0:6},{n:'Chlorwasserstoff HCl',tm:-114,tb:-85,dip:true,x0:228}];
  const top=48,bw=206,bot=H-8;
  B.forEach(b=>{b.p=[];for(let i=0;i<15;i++){const col=i%5,row=Math.floor(i/5);const lx=b.x0+31+col*36,ly=bot-20-row*30;
    b.p.push({x:lx,y:ly,lx,ly,vx:0,vy:0,a:(i%2?0:Math.PI)+(Math.random()-.5)*.3,a0:0,w:0,ph:Math.random()*6});}
    b.p.forEach(p=>p.a0=p.a);});
  const state=b=>T<b.tm?'fest':T<b.tb?'flüssig':'gasförmig';
  const tr=$('#tr',el),tv=$('#tv',el);let solved=false;

      $('#fb',el).innerHTML=`✔ Genau! Bei ${tv.textContent} sind die O₂-Moleküle schon frei beweglich – die HCl-Moleküle halten noch zusammen.`;show($('#after',el));}};
  loop((dt,t)=>{
    ctx.clearRect(0,0,W,H);
    B.forEach(b=>{const s=state(b),L=b.x0+4,R=b.x0+bw-4,pool=bot-74;
      ctx.fillStyle='#fff';ctx.strokeStyle='#9aa5ae';ctx.lineWidth=2;ctx.beginPath();ctx.rect(b.x0,top,bw,bot-top);ctx.fill();ctx.stroke();
      if(s==='flüssig'){ctx.fillStyle='rgba(43,123,214,.07)';ctx.fillRect(b.x0+1,pool-8,bw-2,bot-pool+7);}
      txt(ctx,b.n,b.x0+bw/2,14,'#24405a',14);
      txt(ctx,s,b.x0+bw/2,33,s==='gasförmig'?'#b56a00':s==='flüssig'?'#2b7bd6':'#4b5862',13);

    t+='Name: '+(DB.name||'–')+'\nDatum: '+new Date().toLocaleString('de-DE',{dateStyle:'short',timeStyle:'short'})+'\n\n';
    ST.slice(0,4).forEach((x,i)=>{t+='Station '+(i+1)+' – '+x.t+'\n';x.s.forEach((st,p)=>{t+='  '+(DB.solved[i+'-'+p]?'✔':(DB.seen[i+'-'+p]?'○':'–'))+' '+st.t+'\n';});});
    t+='\nAbschlusstest: '+(DB.quiz?DB.quiz.score+' von '+DB.quiz.total+' Punkten (beim ersten Versuch), '+DB.quiz.date:'noch nicht gemacht')+'\n\n✔ = gelöst   ○ = angesehen   – = nicht bearbeitet\n';return t;};
  const sfb=$('#sfb',el),rt=$('#rt',el);
  $('#dl',el).onclick=()=>{const t=report();rt.value=t;show(rt);
    try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/plain;charset=utf-8'}));
      a.download='Ergebnis_Zwischenmolekulare_Kraefte_'+((DB.name||'ohne_Name').trim().replace(/[^A-Za-z0-9ÄÖÜäöüß_-]+/g,'_'))+'.txt';
      document.body.appendChild(a);a.click();a.remove();sfb.className='fb ok';sfb.textContent='✔ Die Datei wird gespeichert. Falls nichts passiert: Ergebnis kopieren.';}
    catch(e){sfb.className='fb bad';sfb.textContent='Speichern als Datei ist hier nicht möglich – nutze „Ergebnis kopieren“.';}};
  $('#cp',el).onclick=()=>{const t=report();rt.value=t;show(rt);
    navigator.clipboard&&navigator.clipboard.writeText(t).then(()=>{sfb.className='fb ok';sfb.textContent='✔ Ergebnis kopiert.';},()=>{rt.select();sfb.className='fb neutral';sfb.textContent='Markiere den Text unten und kopiere ihn.';});};
  let armed=false;$('#rs',el).onclick=()=>{if(!armed){armed=true;$('#rs',el).textContent='⚠️ Wirklich alles löschen? Nochmal tippen';later(()=>{armed=false;const b=$('#rs',el);if(b)b.textContent='🗑 Fortschritt löschen';},4000);return;}
    DB={cur:{s:0,p:0},seen:{},solved:{},quiz:null,name:''};try{localStorage.removeItem(KEY);}catch(e){}go(0,0);};
}}];

/* ================= Navigation ================= */
const ST=[{n:'1',t:'Permanenter Dipol',s:S1},{n:'2',t:'Dipol-Dipol-Wechselwirkung',s:S2},{n:'3',t:'Permanent vs. temporär',s:S3},{n:'4',t:'London-Kräfte',s:S4},{n:'✓',t:'Abschluss',s:S5}];
let cur={s:0,p:0};
if(DB.cur&&ST[DB.cur.s]&&ST[DB.cur.s].s[DB.cur.p])cur={s:DB.cur.s,p:DB.cur.p};
const isSeen=(s,p)=>!!DB.seen[s+'-'+p];
function markDots(){$$('#dots button').forEach((b,i)=>{const k=cur.s+'-'+i;b.className=i===cur.p?'on':DB.solved[k]?'solved':isSeen(cur.s,i)?'seen':'';});}
function render(){
  clearAll();const st=ST[cur.s];DB.seen[cur.s+'-'+cur.p]=true;DB.cur={s:cur.s,p:cur.p};save();
  $('#tabs').innerHTML=ST.map((x,i)=>`<button class="tab ${i===cur.s?'on':''} ${x.s.every((_,p)=>isSeen(i,p))?'done':''}" data-i="${i}"><span class="n">${x.n}</span>${x.t}</button>`).join('');
  $$('#tabs .tab').forEach(b=>b.onclick=()=>go(+b.dataset.i,0));
  const on=$('#tabs .tab.on');on&&on.scrollIntoView&&on.scrollIntoView({inline:'center',block:'nearest'});
  $('#lab').textContent=(cur.s<4?`Station ${cur.s+1} · `:'')+`Schritt ${cur.p+1} von ${st.s.length} · ${st.s[cur.p].t}`;
  $('#dots').innerHTML=st.s.map((x,i)=>`<button data-i="${i}" aria-label="Schritt ${i+1}"></button>`).join('');markDots();
  $$('#dots button').forEach(b=>b.onclick=()=>go(cur.s,+b.dataset.i));
  const v=$('#view');v.innerHTML='';const sec=document.createElement('section');sec.className='step';v.appendChild(sec);st.s[cur.p].f(sec);if($(':scope > .vis',sec))sec.classList.add('two');
  if(DB.solved[cur.s+'-'+cur.p]&&cur.s<4){$$('[id^=after], #thermo, #again',sec).forEach(e=>e.classList.remove('hidden'));
    $$('#m1,#m2,#m3',sec).forEach(e=>{e.style.opacity=1;e.style.transform='none';});$$('.fill[data-w]',sec).forEach(e=>e.style.width=e.dataset.w+'%');
    const h=$('h2',sec);h&&h.insertAdjacentHTML('afterend','<div class="donebar">✔ Diesen Schritt hast du schon gelöst. Die Erklärungen sind aufgeklappt – du kannst die Aufgaben trotzdem nochmal machen.</div>');}
  setHH();
  $('#prev').disabled=cur.s===0&&cur.p===0;
  const last=cur.p===st.s.length-1,n=$('#next');
  if(cur.s===ST.length-1&&last){n.style.visibility='hidden';}else{n.style.visibility='';n.textContent=last?(cur.s+1<4?`Station ${cur.s+2} ▶`:'Abschlusstest ▶'):'Weiter ▶';}
}
function go(s,p){cur={s,p};render();window.scrollTo({top:0,behavior:'smooth'});}
$('#prev').onclick=()=>{if(cur.p>0)go(cur.s,cur.p-1);else if(cur.s>0)go(cur.s-1,ST[cur.s-1].s.length-1);};
$('#next').onclick=()=>{if(cur.p<ST[cur.s].s.length-1)go(cur.s,cur.p+1);else if(cur.s<ST.length-1)go(cur.s+1,0);};
render();
</script>
</body>
</html>
