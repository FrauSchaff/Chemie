<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Teilchenmodell – Aufgaben</title>
<style>
:root{--bg:#f3f6f8;--panel:#fff;--ink:#16303d;--mute:#5a7280;--line:#c9d6dd;--acc:#0b7a8f;--cv:#fbfdfe;--grid:#e3ebef;--wall:#16303d;--ok:#1b7f3b;--no:#b3261e;--tip:#8a5a00;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10191e;--panel:#18252c;--ink:#e6eff3;--mute:#9bb0bb;--line:#2c3f49;--acc:#4cc3d9;--cv:#0d1519;--grid:#1a2830;--wall:#9bb0bb;--ok:#6fd08c;--no:#ff8f86;--tip:#f0c36a;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;line-height:1.45}
main{max-width:980px;margin:0 auto;padding:14px}
h1{font-size:1.4rem;margin:0 0 10px}
.bar{display:flex;flex-wrap:wrap;gap:10px 18px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px;align-items:center}
.grp{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.grp>b{font-size:.85rem;color:var(--mute);font-weight:600;margin-right:2px}
button,label.pill{font:inherit;font-size:.92rem;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:6px 11px;border-radius:7px;cursor:pointer}
button:hover,label.pill:hover{border-color:var(--acc)}
button:focus-visible,input:focus-visible+span{outline:2px solid var(--acc);outline-offset:2px}
button.main{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
button.on,label.pill:has(input:checked){background:var(--acc);border-color:var(--acc);color:#fff}
label.pill input,label.sw input{position:absolute;opacity:0;pointer-events:none}
label.sw{cursor:pointer}
label.sw span{display:block;width:26px;height:26px;border-radius:50%;border:3px solid var(--panel);box-shadow:0 0 0 1px var(--line)}
label.sw:has(input:checked) span{box-shadow:0 0 0 3px var(--ink)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.tabs button{white-space:nowrap}
.task{background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--acc);border-radius:10px;padding:10px 14px;margin-bottom:10px}
.task strong{font-size:1.15rem}.task p{margin:2px 0 0;color:var(--mute);font-size:.93rem}
input[type=range]{accent-color:var(--acc);width:110px}
.wrap{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px}
canvas{display:block;width:100%;height:auto;background:var(--cv);border-radius:6px;touch-action:none;cursor:crosshair}
.foot{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;font-size:.9rem;color:var(--mute);margin-top:6px}
#fb{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:10px}
#fb h2{font-size:1.05rem;margin:0 0 6px}#fb h3{font-size:.95rem;margin:10px 0 2px}
#fb ul{list-style:none;margin:0;padding:0}#fb li{padding:4px 0 4px 26px;position:relative}
#fb li::before{position:absolute;left:2px;font-weight:700}
li.ok{color:var(--ok)}li.ok::before{content:"✓"}
li.no{color:var(--no)}li.no::before{content:"✗"}
li.tip{color:var(--tip)}li.tip::before{content:"!"}
</style>
</head>
<body>
<main>
<h1>Teilchenmodell: Aufgaben</h1>
<div class="tabs" id="tabs" role="tablist"></div>
<div class="task" style="margin-top:10px"><strong id="tt"></strong><p id="th"></p></div>

<div class="bar" id="tools">
  <div class="grp"><b>Werkzeug</b>
    <label class="pill"><input type="radio" name="tool" value="set" checked><span>Setzen</span></label>
    <label class="pill"><input type="radio" name="tool" value="erase"><span>Löschen</span></label>
  </div>
  <div class="grp"><b>Form</b>
    <label class="pill"><input type="radio" name="shape" value="0" checked><span aria-label="Kreis">● Kreis</span></label>
    <label class="pill"><input type="radio" name="shape" value="1"><span aria-label="Dreieck">▲ Dreieck</span></label>
    <label class="pill"><input type="radio" name="shape" value="2"><span aria-label="Quadrat">■ Quadrat</span></label>
  </div>
  <div class="grp" id="cols"><b>Farbe</b></div>
  <div class="grp"><b>Größe</b><input type="range" id="size" min="8" max="28" value="16" aria-label="Größe neuer Teilchen"></div>
  <div class="grp"><b>Platzierung</b>
    <label class="pill"><input type="radio" name="place" value="free" checked><span>Frei (ungeordnet)</span></label>
    <label class="pill"><input type="radio" name="place" value="grid"><span>Am Raster</span></label>
  </div>
</div>

<div class="bar" id="fields" style="display:none">
  <div class="grp"><b>Feld</b><button id="f0"></button><button id="f1"></button></div>
  <div class="grp"><button id="copy">Feld 1 kopieren</button></div>
</div>

<div class="bar" id="heatbar" style="display:none">
  <div class="grp"><b>Temperatur</b><input type="range" id="temp" min="-20" max="140" value="-10" style="width:200px" aria-label="Temperatur in Grad Celsius"><strong id="tv" style="min-width:4.5em"></strong></div>
  <div class="grp"><button id="pause">Pause</button><button id="reset">Neu starten</button></div>
  <div class="grp"><b>Zustand</b><strong id="zs"></strong></div>
</div>

<div class="wrap"><canvas id="c" width="900" height="560" aria-label="Zeichenfläche"></canvas>
<div class="foot"><span id="count"></span><span id="msg" role="status"></span></div></div>

<div class="bar" style="margin-top:10px">
  <button class="main" id="check">Zeichnung prüfen</button>
  <button id="undo">Rückgängig</button><button id="clear">Alles löschen</button><button id="png">Als Bild speichern</button>
</div>
<div id="fb" hidden aria-live="polite"></div>
</main>

<script>
(function(){
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),W=cv.width,H=cv.height,M=14;
const $=id=>document.getElementById(id);
const COL=['#1f78c8','#e8892b','#2f9e44','#d03b3b','#7a4fc4'],CN=['Blau','Orange','Grün','Rot','Violett'];
const SN={fest:'fest',fl:'flüssig',gas:'gasförmig'};
const TASKS=[
 {n:'Eisen',t:'Zeichne den Feststoff Eisen.',h:'Setze mindestens 12 Eisenteilchen (alle gleich).',k:'fest'},
 {n:'Wasser',t:'Zeichne die Flüssigkeit Wasser.',h:'Setze mindestens 12 Wasserteilchen (alle gleich).',k:'fl'},
 {n:'Sauerstoff',t:'Zeichne das Gas Sauerstoff.',h:'Setze mindestens 6 Sauerstoffteilchen (alle gleich).',k:'gas'},
 {n:'Salzwasser',t:'Zeichne das Stoffgemisch Salzwasser aus Salz und Wasser.',h:'Nimm zwei Teilchenarten (Wasser und Salz), die sich in Farbe oder Form unterscheiden. Salzwasser ist flüssig.',k:'mix'},
 {n:'Schmelzen',t:'Zustandsänderung Schmelzen: Zeichne Wasser vor und nach dem Schmelzen von Eis.',h:'Feld 1: Eis (fest). Feld 2: Wasser (flüssig). Es sind dieselben Teilchen.',k:'chg',s:['fest','fl']},
 {n:'Verdampfen',t:'Zustandsänderung Verdampfen: Zeichne Wasser vor und nach dem Verdampfen.',h:'Feld 1: Wasser (flüssig). Feld 2: Wasserdampf (gasförmig).',k:'chg',s:['fl','gas']},
 {n:'Erwärmung',t:'Zeige, was bei Erwärmung passiert.',h:'Erhöhe mit dem Regler langsam die Temperatur von Wasser und beobachte die Teilchen. Beschreibe in deinem Heft, wie sich Bewegung und Abstand ändern.',k:'heat'}];
let task=0,fld=0,drag=null;
const data=TASKS.map(()=>[[],[]]),hist={};
const cur=()=>data[task][fld];
const hk=()=>task+'_'+fld;
const val=n=>document.querySelector('input[name='+n+']:checked').value;
let colour=0;
COL.forEach((c,i)=>{const l=document.createElement('label');l.className='sw';l.innerHTML='<input type="radio" name="col" value="'+i+'"'+(i?'':' checked')+'><span style="background:'+c+'" title="'+CN[i]+'"></span>';$('cols').appendChild(l)});
TASKS.forEach((t,i)=>{const b=document.createElement('button');b.textContent=(i+1)+' '+t.n;b.onclick=()=>{task=i;fld=0;setup()};$('tabs').appendChild(b)});

function setup(){
 [...$('tabs').children].forEach((b,i)=>b.classList.toggle('on',i===task));
 const T=TASKS[task];$('tt').textContent=T.t;$('th').textContent=T.h;
 $('fields').style.display=T.k==='chg'?'flex':'none';
 const hv=T.k==='heat';$('tools').style.display=hv?'none':'flex';$('heatbar').style.display=hv?'flex':'none';
 ['check','undo','clear'].forEach(i=>$(i).style.display=hv?'none':'');hv?simStart():simStop();
 if(T.k==='chg'){$('f0').textContent='Feld 1 · '+SN[T.s[0]];$('f1').textContent='Feld 2 · '+SN[T.s[1]];
  $('f0').classList.toggle('on',fld===0);$('f1').classList.toggle('on',fld===1);$('copy').style.display=fld===1?'':'none'}
 $('fb').hidden=true;$('msg').textContent='';upd();draw();
}
$('f0').onclick=()=>{fld=0;setup()};$('f1').onclick=()=>{fld=1;setup()};
$('copy').onclick=()=>{snap();data[task][1]=data[task][0].map(p=>({...p}));upd();draw()};
function snap(){const h=hist[hk()]=hist[hk()]||[];h.push(JSON.stringify(cur()));if(h.length>60)h.shift()}
function pos(e){const b=cv.getBoundingClientRect();return{x:(e.clientX-b.left)*W/b.width,y:(e.clientY-b.top)*H/b.height}}
function hit(p){const a=cur();for(let i=a.length-1;i>=0;i--)if(Math.hypot(a[i].x-p.x,a[i].y-p.y)<=a[i].r+4)return i;return -1}
function clampP(p){p.x=Math.max(M+p.r,Math.min(W-M-p.r,p.x));p.y=Math.max(M+p.r,Math.min(H-M-p.r,p.y))}
function sn(p){if(val('place')==='grid'){p.x=M+16+Math.round((p.x-M-16)/32)*32;p.y=M+16+Math.round((p.y-M-16)/32)*32}clampP(p)}
function upd(){const n=TASKS[task].k==='heat'?S.P.length:cur().length;$('count').textContent=n+(n===1?' Teilchen':' Teilchen')+' in diesem Feld'}
cv.addEventListener('pointerdown',e=>{
 e.preventDefault();if(TASKS[task].k==='heat')return;cv.setPointerCapture(e.pointerId);
 const p=pos(e),i=hit(p),a=cur();$('msg').textContent='';snap();
 if(val('tool')==='erase'){if(i>=0)a.splice(i,1);else hist[hk()].pop()}
 else if(i>=0){drag={p:a[i],dx:a[i].x-p.x,dy:a[i].y-p.y};a.push(a.splice(i,1)[0])}
 else{const n={x:p.x,y:p.y,s:+val('shape'),c:+val('col'),r:+$('size').value};sn(n);
  if(a.some(q=>Math.hypot(q.x-n.x,q.y-n.y)<q.r+n.r-2)){hist[hk()].pop();$('msg').textContent='Teilchen dürfen sich nicht überlappen.'}else a.push(n)}
 upd();draw()});
cv.addEventListener('pointermove',e=>{if(!drag)return;const p=pos(e);drag.p.x=p.x+drag.dx;drag.p.y=p.y+drag.dy;sn(drag.p);draw()});
['pointerup','pointercancel'].forEach(t=>cv.addEventListener(t,()=>{drag=null}));
const cssv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function shape(x,p){const{x:X,y:Y,r}=p;x.beginPath();
 if(p.s===0)x.arc(X,Y,r,0,7);
 else if(p.s===1){x.moveTo(X,Y-1.15*r);x.lineTo(X+1.05*r,Y+.8*r);x.lineTo(X-1.05*r,Y+.8*r);x.closePath()}
 else x.rect(X-.9*r,Y-.9*r,1.8*r,1.8*r);
 x.fillStyle=COL[p.c];x.fill();x.lineWidth=1.5;x.strokeStyle='rgba(0,0,0,.5)';x.stroke()}
function draw(){
 ctx.clearRect(0,0,W,H);
 if(TASKS[task].k==='heat'){drawSim();return}
 if(val('place')==='grid'){ctx.strokeStyle=cssv('--grid');ctx.lineWidth=1;ctx.beginPath();
  for(let x=M+16;x<=W-M;x+=32){ctx.moveTo(x,M);ctx.lineTo(x,H-M)}for(let y=M+16;y<=H-M;y+=32){ctx.moveTo(M,y);ctx.lineTo(W-M,y)}ctx.stroke()}
 ctx.strokeStyle=cssv('--wall');ctx.lineWidth=4;ctx.strokeRect(M-2,M-2,W-2*M+4,H-2*M+4);
 const T=TASKS[task];
 if(T.k==='chg'){ctx.fillStyle=cssv('--mute');ctx.font='bold 18px sans-serif';ctx.fillText('Feld '+(fld+1)+': '+SN[T.s[fld]],M+10,M+26)}
 cur().forEach(p=>shape(ctx,p));
}
document.querySelectorAll('input[name=place]').forEach(i=>i.onchange=draw);
$('undo').onclick=()=>{const h=hist[hk()];if(h&&h.length){data[task][fld]=JSON.parse(h.pop());upd();draw()}};
$('clear').onclick=()=>{if(cur().length&&confirm('Alle Teilchen in diesem Feld löschen?')){snap();data[task][fld]=[];upd();draw()}};
$('png').onclick=()=>{const t=document.createElement('canvas');t.width=W;t.height=H;const x=t.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,W,H);
 x.strokeStyle='#16303d';x.lineWidth=4;x.strokeRect(M-2,M-2,W-2*M+4,H-2*M+4);(TASKS[task].k==='heat'?S.P.map(q=>({x:M+q.x*SG,y:M+q.y*SG,s:0,c:0,r:SG/2})):cur()).forEach(p=>shape(x,p));
 try{const a=document.createElement('a');a.download='teilchenmodell.png';a.href=t.toDataURL('image/png');a.click()}catch(e){}};

/* ---------- Auswertung ---------- */
const key=p=>p.s+'-'+p.c;
function an(a){const n=a.length,ty={};a.forEach(p=>{(ty[key(p)]=ty[key(p)]||[]).push(p.r)});
 let nb=0,cross=0,gs=[],b4=[0,0],b6=[0,0],bonds=0;
 a.forEach((p,i)=>{let m=1e9,mj=-1,c=0;
  a.forEach((q,j)=>{if(i===j)return;const dx=q.x-p.x,dy=q.y-p.y,g=Math.hypot(dx,dy)/(p.r+q.r);
   if(g<m){m=g;mj=j}
   if(g<=1.35){c++;bonds++;const th=Math.atan2(dy,dx);b4[0]+=Math.cos(4*th);b4[1]+=Math.sin(4*th);b6[0]+=Math.cos(6*th);b6[1]+=Math.sin(6*th)}});
  if(mj>=0){gs.push(m);if(key(a[mj])!==key(p))cross++}nb+=c});
 const mg=gs.reduce((x,y)=>x+y,0)/(gs.length||1),cv=Math.sqrt(gs.reduce((x,y)=>x+(y-mg)**2,0)/(gs.length||1))/(mg||1);
 const q=new Set(a.map(p=>(p.x>W/2?1:0)+(p.y>H/2?2:0))).size;
 const same=Object.values(ty).every(r=>Math.max(...r)-Math.min(...r)<=3);
 return{n,ty,nt:Object.keys(ty).length,mg,cv,nb:nb/(n||1),psi:bonds?Math.max(Math.hypot(...b4),Math.hypot(...b6))/bonds:0,mix:cross/(n||1),q,same,
  r:a.length?a.reduce((x,p)=>x+p.r,0)/n:0}}
const c=(ok,g,b,soft)=>({ok,soft,t:ok?g:b});
function st(a,k){const A=an(a),o=[],min=k==='gas'?6:12;
 if(!A.n)return[c(false,'','Du hast noch keine Teilchen gesetzt.')];
 o.push(c(A.n>=min,'Du hast genug Teilchen gesetzt ('+A.n+').','Setze mindestens '+min+' Teilchen, sonst erkennt man den Zustand nicht gut (bisher '+A.n+').'));
 o.push(c(A.nt===1&&A.same,'Alle Teilchen sind gleich (Form, Farbe, Größe).','Ein reiner Stoff besteht nur aus gleichen Teilchen. Nimm eine Form, eine Farbe und eine Größe.'));
 if(k==='fest'){
  o.push(c(A.mg<=1.25&&A.nb>=2.5,'Die Teilchen liegen dicht an dicht.','Im Feststoff sind die Teilchen dicht gepackt, weil die Anziehungskräfte stark sind. Rücke sie näher zusammen.'));
  o.push(c(A.psi>=.6,'Die Teilchen sind regelmäßig angeordnet (Gitter).','Im Feststoff sitzen die Teilchen an festen Plätzen in einer regelmäßigen Ordnung (Gitter). Zeichne gleichmäßige Reihen; das Raster hilft dabei.'))}
 if(k==='fl'){
  o.push(c(A.mg<=1.3&&A.nb>=2.2,'Die Teilchen berühren sich fast alle.','In einer Flüssigkeit liegen die Teilchen dicht beieinander. Zwischen ihnen sind keine großen Lücken.'));
  o.push(c(A.psi<.55,'Die Anordnung ist unregelmäßig.','Das sieht noch zu regelmäßig aus, fast wie ein Feststoff. In einer Flüssigkeit sind die Teilchen unregelmäßig angeordnet und gegeneinander verschiebbar.'));
  const low=a.filter(p=>p.y>H*.3).length/A.n;
  o.push(c(low>=.9,'Die Flüssigkeit liegt unten im Gefäß.','Tipp: Eine Flüssigkeit sammelt sich unten im Gefäß, oben bleibt Platz frei.',true))}
 if(k==='gas'){
  o.push(c(A.mg>=2&&A.nb<=.6,'Die Abstände sind viel größer als die Teilchen selbst.','Im Gas sind die Abstände zwischen den Teilchen sehr groß, viel größer als ein Teilchen selbst. Verteile sie weiter auseinander (oder verkleinere die Teilchen).'));
  o.push(c(A.cv>=.2,'Die Teilchen sind ungeordnet verteilt.','Gasteilchen bewegen sich ungeordnet. Verteile sie unregelmäßig, nicht in Reihen.'));
  o.push(c(A.q===4,'Das Gas füllt den ganzen Behälter.','Ein Gas füllt den gesamten Behälter aus. Setze auch Teilchen in die leeren Bereiche.'))}
 return o}
function mixCheck(a){const A=an(a),o=[];
 if(!A.n)return[c(false,'','Du hast noch keine Teilchen gesetzt.')];
 o.push(c(A.nt===2,'Du hast genau zwei Teilchenarten verwendet.',A.nt<2?'Für ein Gemisch brauchst du zwei verschiedene Teilchenarten. Unterscheide sie durch Farbe oder Form.':'Du hast '+A.nt+' Teilchenarten. Beschränke dich auf zwei Komponenten.'));
 if(A.nt>=2)o.push(c(Object.values(A.ty).every(r=>r.length>=5),'Von jeder Teilchenart sind genug Teilchen da.','Setze von jeder Art mindestens 5 Teilchen.'));
 o.push(c(A.same,'Teilchen derselben Art sind gleich groß.','Teilchen derselben Art müssen gleich aussehen: gleiche Form, Farbe und Größe.'));
 if(A.nt===2)o.push(c(A.mix>=.25,'Die beiden Teilchenarten sind gut durchmischt.','Im Gemisch sind die Teilchen durchmischt. Bei dir sitzen gleiche Teilchen noch in Gruppen zusammen. Verteile sie abwechselnd.'));
 o.push(c(A.mg<=1.35&&A.nb>=2.2&&A.psi<.55,'Das Salzwasser ist flüssig: Die Teilchen liegen dicht, aber unregelmäßig.','Salzwasser ist eine Flüssigkeit: Die Teilchen liegen dicht beieinander, aber nicht in einem regelmäßigen Gitter.'));
 return o}
function chgCheck(T){const[a,b]=data[task],A=an(a),B=an(b),o=[];
 const x=[];
 if(A.n&&B.n){
  x.push(c(A.n===B.n,'In beiden Feldern gibt es gleich viele Teilchen.','Die Teilchenzahl ändert sich bei einer Zustandsänderung nicht. Zeichne in beiden Feldern gleich viele Teilchen ('+A.n+' und '+B.n+'). Tipp: „Feld 1 kopieren“.'));
  x.push(c(Object.keys(A.ty).join()===Object.keys(B.ty).join()&&Math.abs(A.r-B.r)<=3,'Die Teilchen selbst bleiben unverändert.','Die Teilchen verändern sich nicht (gleiche Form, Farbe, Größe). Nur ihre Anordnung und ihr Abstand ändern sich.'));
  x.push(c(B.mg>A.mg,'Im zweiten Feld sind die Abstände größer.','Nach dem '+(T.s[1]==='fl'?'Schmelzen':'Verdampfen')+' sind die Abstände zwischen den Teilchen größer als vorher.'))}
 return[{h:'Feld 1 · '+SN[T.s[0]],i:st(a,T.s[0])},{h:'Feld 2 · '+SN[T.s[1]],i:st(b,T.s[1])},{h:'Vergleich der Felder',i:x.length?x:[c(false,'','Zeichne zuerst in beiden Feldern Teilchen.')]}]}
$('check').onclick=()=>{const T=TASKS[task];let g;
 if(T.k==='chg')g=chgCheck(T);else g=[{h:'',i:T.k==='mix'?mixCheck(cur()):st(cur(),T.k)}];
 let bad=0,html='';
 g.forEach(s=>{html+=(s.h?'<h3>'+s.h+'</h3>':'')+'<ul>'+s.i.map(i=>{if(!i.ok&&!i.soft)bad++;return'<li class="'+(i.ok?'ok':i.soft?'tip':'no')+'">'+i.t+'</li>'}).join('')+'</ul>'});
 const head=bad===0?'Sehr gut, die Aufgabe ist gelöst!':bad===1?'Fast geschafft: Ein Punkt fehlt noch.':'Noch nicht ganz: '+bad+' Punkte kannst du verbessern.';
 $('fb').innerHTML='<h2>'+head+'</h2>'+html;$('fb').hidden=false;$('fb').scrollIntoView({behavior:'smooth',block:'nearest'})};
/* ---------- Erwärmung: Teilchensimulation ---------- */
const SG=28,LX=(W-2*M)/SG,LY=(H-2*M)/SG;
let S={P:[],run:true,raf:0,tick:0};
const TT=[[-20,.15],[0,.36],[20,.42],[60,.5],[100,.7],[120,1],[140,1.6]];
function tStar(t){for(let i=1;i<TT.length;i++)if(t<=TT[i][0]){const a=TT[i-1],b=TT[i];return a[1]+(b[1]-a[1])*(t-a[0])/(b[0]-a[0])}return TT[TT.length-1][1]}
function simInit(){S.P=[];for(let r=0;r<5;r++)for(let k=0;k<8;k++)S.P.push({x:2+k*1.1+(r%2)*.55,y:LY-1.5-r*.95,vx:Math.random()-.5,vy:Math.random()-.5,fx:0,fy:0});frc()}
function frc(){const P=S.P;P.forEach(p=>{p.fx=0;p.fy=.015});
 for(let i=0;i<P.length;i++)for(let j=i+1;j<P.length;j++){const a=P[i],b=P[j],dx=b.x-a.x,dy=b.y-a.y,d2=dx*dx+dy*dy;if(d2>6.25||d2<.01)continue;
  const i2=1/d2,i6=i2*i2*i2;let f=24*i6*(2*i6-1)*i2;if(f>400)f=400;a.fx-=f*dx;a.fy-=f*dy;b.fx+=f*dx;b.fy+=f*dy}}
function simStep(){const P=S.P,dt=.004,T=tStar(+$('temp').value);
 for(let k=0;k<25;k++){
  P.forEach(p=>{p.vx+=p.fx*dt/2;p.vy+=p.fy*dt/2;p.x+=p.vx*dt;p.y+=p.vy*dt;
   if(p.x<.5){p.x=.5;p.vx=Math.abs(p.vx)}if(p.x>LX-.5){p.x=LX-.5;p.vx=-Math.abs(p.vx)}
   if(p.y<.5){p.y=.5;p.vy=Math.abs(p.vy)}if(p.y>LY-.5){p.y=LY-.5;p.vy=-Math.abs(p.vy)}});
  frc();let ke=0;
  P.forEach(p=>{p.vx+=p.fx*dt/2;p.vy+=p.fy*dt/2;ke+=p.vx*p.vx+p.vy*p.vy});
  const l=Math.sqrt(1+.05*(T/(ke/(2*P.length)||1e-6)-1));P.forEach(p=>{p.vx*=l;p.vy*=l})}}
function drawSim(){ctx.clearRect(0,0,W,H);ctx.strokeStyle=cssv('--wall');ctx.lineWidth=4;ctx.strokeRect(M-2,M-2,W-2*M+4,H-2*M+4);
 const a=S.P.map(p=>({x:M+p.x*SG,y:M+p.y*SG,s:0,c:0,r:SG/2}));a.forEach(p=>shape(ctx,p));
 $('tv').textContent=$('temp').value+' °C';
 if(++S.tick%10===1){const A=an(a);$('zs').textContent=A.psi>=.6&&A.nb>=3?'fest':A.nb>=1.8?'flüssig':'gasförmig'}}
function simLoop(){if(TASKS[task].k!=='heat')return;if(S.run)simStep();drawSim();S.raf=requestAnimationFrame(simLoop)}
function simStart(){cancelAnimationFrame(S.raf);if(!S.P.length)simInit();S.raf=requestAnimationFrame(simLoop)}
function simStop(){cancelAnimationFrame(S.raf)}
$('pause').onclick=()=>{S.run=!S.run;$('pause').textContent=S.run?'Pause':'Weiter'};
$('reset').onclick=()=>{simInit()};
setup();
})();
</script>
