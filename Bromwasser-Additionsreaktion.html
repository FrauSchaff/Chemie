<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Der Fall Bromwasser – Additionsreaktion Schritt für Schritt</title>
<style>
:root{--dark:#1B1F2A;--dark2:#2E3445;--amb:#C8661B;--ambT:#FBEEE3;--yel:#F2C230;--teal:#2A9D8F;--tealT:#E3F2F0;--light:#F1F2F4;--muted:#6B7280;--line:#D5D8DE}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--dark);color:var(--dark);touch-action:manipulation;-webkit-user-select:none;user-select:none}
button{font:inherit;touch-action:manipulation;cursor:pointer}
header{background:var(--dark);color:#fff;padding:14px 20px 0}
.toprow{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{flex:1;min-width:220px}
.brand small{display:block;color:var(--yel);font-weight:700;letter-spacing:.18em;font-size:12px}
.brand h1{margin:2px 0 0;font-size:24px;line-height:1.15}
.hbtn{background:var(--dark2);color:#fff;border:0;border-radius:12px;padding:12px 16px;font-size:16px;font-weight:600;display:flex;align-items:center;gap:8px;min-height:48px}
.hbtn .badge{background:var(--amb);border-radius:999px;padding:1px 9px;font-size:14px}
.progress{display:flex;gap:6px;margin:14px 0 0;overflow-x:auto;padding-bottom:12px}
.pstep{flex:1;min-width:92px;background:var(--dark2);color:#9AA0AE;border-radius:10px;padding:8px 10px;font-size:13px;font-weight:600;white-space:nowrap}
.pstep b{display:block;font-size:11px;letter-spacing:.12em;opacity:.8}
.pstep.done{background:var(--teal);color:#fff}
.pstep.now{background:var(--amb);color:#fff}
.tape{height:22px;background:repeating-linear-gradient(-45deg,var(--yel) 0 18px,var(--dark) 18px 36px)}
main{display:grid;gap:16px;padding:16px;background:#E9EBEF;min-height:calc(100vh - 150px)}
@media (min-width:900px) and (orientation:landscape){main{grid-template-columns:1.35fr 1fr;align-items:start}}
.card{background:#fff;border-radius:18px;box-shadow:0 2px 10px rgba(27,31,42,.08)}
#stagecard{padding:12px;position:relative}
#stage{position:relative;width:100%;aspect-ratio:700/380}
#stage>svg,#stage>.imgwrap{position:absolute;inset:0;width:100%;height:100%}
.imgwrap{display:flex;align-items:center;justify-content:center}
.imgwrap img{max-width:100%;max-height:100%;border-radius:10px;display:block}
.imgbox{position:relative;display:inline-block;max-height:100%}
.hidden{display:none!important}
.stagehint{font-size:14px;color:var(--muted);text-align:center;margin:6px 0 2px;min-height:20px}
#panel{padding:22px 22px 18px}
.kicker{color:var(--amb);font-weight:800;font-size:13px;letter-spacing:.14em;text-transform:uppercase}
#panel h2{margin:4px 0 2px;font-size:26px}
.taskcount{color:var(--muted);font-size:14px;margin-bottom:12px}
.prompt{font-size:19px;line-height:1.45;margin:0 0 14px}
.choices{display:grid;gap:10px}
.choice{text-align:left;background:var(--light);border:2px solid transparent;border-radius:14px;padding:14px 16px;font-size:17px;min-height:54px;color:var(--dark)}
.choice.wrong{border-color:var(--amb);background:var(--ambT)}
.choice.right{border-color:var(--teal);background:var(--tealT);font-weight:700}
.choice.reveal{border-color:var(--teal);border-style:dashed}
.big{background:var(--amb);color:#fff;border:0;border-radius:14px;padding:16px 22px;font-size:19px;font-weight:700;min-height:58px;width:100%}
.big:disabled{opacity:.45}
.fb{border-radius:14px;padding:12px 14px;font-size:16px;line-height:1.4;margin-top:14px}
.fb.ok{background:var(--tealT);border-left:0;color:#14544C}
.fb.no{background:var(--ambT);color:#7A3A0C}
.fb.tip{background:#FDF6DC;color:#6B5200}
.actions{display:flex;gap:10px;margin-top:16px}
.actions button{flex:1;min-height:54px;border-radius:14px;border:0;font-size:17px;font-weight:700}
#hintBtn{background:var(--light);color:var(--dark)}
#nextBtn{background:var(--teal);color:#fff}
#nextBtn:disabled{background:#B9C2C9}
.chips{display:flex;gap:12px;flex-wrap:wrap;margin:6px 0}
.chip{background:var(--dark);color:#fff;border:0;border-radius:999px;padding:12px 22px;font-size:22px;font-weight:800;min-width:76px;min-height:54px}
.chip.sel{outline:4px solid var(--yel)}
.chip.used{opacity:.3}
.chip.word{font-size:16px;font-weight:700;padding:10px 16px;background:var(--dark2)}
textarea{width:100%;min-height:96px;border:2px solid var(--line);border-radius:14px;padding:12px;font:inherit;font-size:17px;-webkit-user-select:text;user-select:text}
.cloze{font-size:18px;line-height:2.3}
.gap{display:inline-block;min-width:130px;border-bottom:3px solid var(--amb);text-align:center;padding:0 6px;font-weight:700;color:var(--amb);background:var(--ambT);border-radius:6px 6px 0 0;cursor:pointer}
.gap.sel{background:#FDF6DC;outline:3px solid var(--yel)}
.gap.right{color:var(--teal);border-color:var(--teal);background:var(--tealT)}
.gap.wrongg{border-color:#B00020;color:#B00020}
.order .choice .num{display:inline-flex;width:30px;height:30px;border-radius:50%;background:var(--teal);color:#fff;align-items:center;justify-content:center;margin-right:10px;font-weight:800}
.evid{background:var(--light);border-radius:14px;padding:12px 14px;margin:10px 0;font-size:16px;line-height:1.45}
.evid b{color:var(--amb)}
.bookbtn{background:var(--dark);color:#fff;border:0;border-radius:14px;padding:14px;font-size:17px;font-weight:700;width:100%;margin-top:10px;min-height:54px}
/* overlays */
.overlay{position:fixed;inset:0;background:rgba(27,31,42,.75);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
.sheet{background:#fff;border-radius:20px;max-width:760px;width:100%;max-height:90vh;overflow:auto;padding:22px}
.sheet h3{margin:0 0 6px;font-size:22px}
.sheet img{width:100%;border-radius:10px;border:1px solid var(--line);margin:10px 0}
.sheet .close{float:right;background:var(--light);border:0;border-radius:12px;padding:10px 16px;font-weight:700;font-size:16px;min-height:46px}
.caption{color:var(--muted);font-size:14px}
/* svg */
.atom{font:600 28px -apple-system,Helvetica,Arial,sans-serif;fill:#1B1F2A}
.bond{stroke:#1B1F2A;stroke-width:3;stroke-linecap:round}
.lp{fill:#1B1F2A}
.lbl{font:800 22px -apple-system,Helvetica,Arial,sans-serif}
.name{font:700 18px -apple-system,Helvetica,Arial,sans-serif;fill:#2A9D8F}
.arrow{fill:none;stroke:#2563EB;stroke-width:3.5;stroke-linecap:round}
.pulse{fill:none;stroke:var(--yel);stroke-width:5;animation:pulse 1s ease-out}
.pulse.bad{stroke:var(--amb)}
.ring{fill:rgba(242,194,48,.25);stroke:#F2C230;stroke-width:3;stroke-dasharray:6 5;animation:spin 1.2s linear infinite}
@keyframes pulse{from{opacity:1}to{opacity:0}}
@keyframes spin{to{stroke-dashoffset:-22}}
.bubble{fill:none;stroke:#fff;stroke-width:2.5;opacity:0}
.bubbling .bubble{animation:rise 1.4s linear infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:.9}100%{transform:translateY(-150px);opacity:0}}
#liq{transition:fill 3.2s ease}
.marker{position:absolute;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;border:5px solid var(--yel);pointer-events:none;animation:pulse 1.2s ease-out forwards}
.marker.keep{animation:none;border-color:var(--teal)}
.final h3{color:var(--teal)}
</style>
</head>
<body>
<header>
  <div class="toprow">
    <div class="brand"><small>ERMITTLUNGSAKTE 3.1 · CHEMIE 10</small><h1>Der Fall Bromwasser</h1></div>
    <button class="hbtn" id="notesBtn" aria-label="Notizbuch öffnen">🗂️ Notizbuch <span class="badge" id="notesCount">0</span></button>
    <button class="hbtn" id="restartBtn" aria-label="Von vorn beginnen">↺ Neustart</button>
  </div>
  <div class="progress" id="progress"></div>
</header>
<div class="tape" aria-hidden="true"></div>
<main>
  <section class="card" id="stagecard">
    <div id="stage">
      <svg id="tube" viewBox="0 0 700 380" aria-label="Reagenzglas mit Bromwasser">
        <rect x="0" y="0" width="700" height="380" fill="#fff"/>
        <g id="gas" opacity="0" style="transition:opacity .6s">
          <path d="M350 20 L350 300" stroke="#8A90A0" stroke-width="10" stroke-linecap="round"/>
          <text x="370" y="40" class="name" style="fill:#8A90A0">Ethen</text>
        </g>
        <rect x="290" y="40" width="120" height="300" rx="60" fill="#F7F8FA" stroke="#555B66" stroke-width="6"/>
        <path id="liq" d="M296 170 L404 170 L404 280 A54 54 0 0 1 296 280 Z" fill="#C8661B"/>
        <g id="bubbles">
          <circle class="bubble" cx="335" cy="300" r="7" style="animation-delay:0s"/>
          <circle class="bubble" cx="360" cy="305" r="5" style="animation-delay:.3s"/>
          <circle class="bubble" cx="345" cy="310" r="9" style="animation-delay:.7s"/>
          <circle class="bubble" cx="370" cy="300" r="6" style="animation-delay:1s"/>
          <circle class="bubble" cx="352" cy="305" r="4" style="animation-delay:.5s"/>
        </g>
        <rect x="280" y="30" width="140" height="18" rx="6" fill="#555B66"/>
        <text x="470" y="200" class="name" id="tubeLbl" style="fill:#C8661B;font-size:22px">Bromwasser</text>
      </svg>
      <svg id="mol" class="hidden" viewBox="0 0 700 380" aria-label="Moleküldarstellung">
        <defs><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2563EB"/></marker></defs>
        <rect x="0" y="0" width="700" height="380" fill="#fff"/>
        <g id="molg"></g><g id="arrows"></g><g id="fx"></g>
      </svg>
      <div class="imgwrap hidden" id="imgwrap"><div class="imgbox" id="imgbox"><img id="stageImg" alt=""></div></div>
    </div>
    <div class="stagehint" id="stagehint"></div>
  </section>
  <section class="card" id="panel"></section>
</main>
<div class="overlay hidden" id="overlay"><div class="sheet" id="sheet"></div></div>

const R=t=>t==='Br'?21:15;
function render(s){
  let h='';
  for(const k in s.clouds){const c=s.clouds[k];if(c.op>0.01)h+=`<ellipse cx="${c.x}" cy="${c.y}" rx="${c.rx}" ry="${c.ry}" fill="${c.c}" opacity="${c.op}"/>`;}
  for(const k in s.bonds){const b=s.bonds[k],a=s.atoms[b.a],z=s.atoms[b.b];if(!a||!z||b.o<0.01)continue;
    const dx=z.x-a.x,dy=z.y-a.y,len=Math.hypot(dx,dy)||1,ux=dx/len,uy=dy/len,px=-uy,py=ux;
    const ra=R(a.t),rz=R(z.t);const x1=a.x+ux*ra,y1=a.y+uy*ra,x2=z.x-ux*rz,y2=z.y-uy*rz;
    const f=Math.max(0,Math.min(1,b.o-1)),o1=Math.min(1,b.o),off=5*f;
    const op=Math.min(a.op,z.op);
    h+=`<line class="bond" x1="${x1+px*off}" y1="${y1+py*off}" x2="${x2+px*off}" y2="${y2+py*off}" opacity="${o1*op}"/>`;
    if(f>0.01)h+=`<line class="bond" x1="${x1-px*off}" y1="${y1-py*off}" x2="${x2-px*off}" y2="${y2-py*off}" opacity="${f*op}"/>`;}
  for(const k in s.atoms){const a=s.atoms[k];h+=`<text class="atom" x="${a.x}" y="${a.y}" text-anchor="middle" dominant-baseline="central" opacity="${a.op}">${a.t}</text>`;}
  for(const k in s.lps){const l=s.lps[k],a=s.atoms[l.at];if(!a||l.op<0.01)continue;const r=l.ang*Math.PI/180,c=Math.cos(r),si=Math.sin(r);
    const cx=a.x+c*29,cy=a.y+si*23,px=-si,py=c;
    h+=`<circle class="lp" cx="${cx+px*5}" cy="${cy+py*5}" r="2.8" opacity="${l.op*a.op}"/><circle class="lp" cx="${cx-px*5}" cy="${cy-py*5}" r="2.8" opacity="${l.op*a.op}"/>`;}
  for(const k in s.labels){const l=s.labels[k];let x=l.x,y=l.y;if(l.at){const a=s.atoms[l.at];if(!a)continue;x=a.x+l.dx;y=a.y+l.dy;}
    h+=`<text class="${l.cls||'lbl'}" x="${x}" y="${y}" text-anchor="middle" dominant-baseline="central" fill="${l.c}" style="fill:${l.c}" opacity="${l.op}">${l.text}</text>`;}
  $('molg').innerHTML=h;
}
function mix(a,b,t){
  const out={};
  for(const cat of ['atoms','bonds','lps','clouds','labels']){out[cat]={};const A1=a[cat]||{},B1=b[cat]||{};
    const keys=new Set([...Object.keys(A1),...Object.keys(B1)]);
    for(const k of keys){let p=A1[k],q=B1[k];
      if(!p){p={...q,op:0};if('o'in q)p.o=0;} if(!q){q={...p,op:0};if('o'in p)q.o=0;}
      const r={};for(const f in q){const v1=p[f],v2=q[f];r[f]=(typeof v2==='number'&&typeof v1==='number')?v1+(v2-v1)*t:(t<.5&&v1!==undefined?v1:v2);}
      out[cat][k]=r;}}
  return out;
}
function setScene(s){cur=clone(s);render(cur);}
function tween(to,dur=1400){return new Promise(res=>{const from=clone(cur),t0=performance.now();
  function step(now){let t=Math.min(1,(now-t0)/dur);const e=t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;cur=mix(from,to,e);render(cur);

/* arrows */
function drawArrow(p,q,bend){
  const mx=(p[0]+q[0])/2,my=(p[1]+q[1])/2,dx=q[0]-p[0],dy=q[1]-p[1],len=Math.hypot(dx,dy);
  const cx=mx+(-dy/len)*bend,cy=my+(dx/len)*bend;
  const path=document.createElementNS(NS,'path');path.setAttribute('d',`M${p[0]} ${p[1]} Q${cx} ${cy} ${q[0]} ${q[1]}`);
  path.setAttribute('class','arrow');path.setAttribute('marker-end','url(#ah)');$('arrows').appendChild(path);
  const L0=path.getTotalLength();path.style.strokeDasharray=L0;path.style.strokeDashoffset=L0;
  path.getBoundingClientRect();path.style.transition='stroke-dashoffset .9s ease';path.style.strokeDashoffset=0;
  setTimeout(()=>{path.style.strokeDasharray='none'},950);
}

function atomP(id){const a=cur.atoms[id];return[a.x,a.y]}
function bondMid(id){const b=cur.bonds[id];const a=cur.atoms[b.a],z=cur.atoms[b.b];return[(a.x+z.x)/2,(a.y+z.y)/2]}

/* hit testing */
function svgPoint(svg,evt){const pt=svg.createSVGPoint();pt.x=evt.clientX;pt.y=evt.clientY;return pt.matrixTransform(svg.getScreenCTM().inverse());}
function segDist(p,a,b){const dx=b.x-a.x,dy=b.y-a.y,l2=dx*dx+dy*dy;let t=((p.x-a.x)*dx+(p.y-a.y)*dy)/l2;t=Math.max(0.15,Math.min(.85,t));return Math.hypot(p.x-(a.x+t*dx),p.y-(a.y+t*dy));}
function hit(p){let best=null,bd=30;
  for(const k in cur.atoms){const a=cur.atoms[k];if(a.op<.5)continue;const d=Math.hypot(p.x-a.x,p.y-a.y)-(a.t==='Br'?6:2);if(d<bd){bd=d;best=k;}}
  for(const k in cur.bonds){const b=cur.bonds[k];if(b.o<.5)continue;const d=segDist(p,cur.atoms[b.a],cur.atoms[b.b])+3;if(d<bd){bd=d;best=k;}}
  return best;}
function pulseAt(x,y,bad){const c=document.createElementNS(NS,'circle');c.setAttribute('cx',x);c.setAttribute('cy',y);c.setAttribute('r',26);c.setAttribute('class','pulse'+(bad?' bad':''));$('fx').appendChild(c);setTimeout(()=>c.remove(),1000);}
function ringAt(id){const p=cur.atoms[id]?atomP(id):bondMid(id);const c=document.createElementNS(NS,'circle');c.setAttribute('cx',p[0]);c.setAttribute('cy',p[1]);c.setAttribute('r',30);c.setAttribute('class','ring');c.dataset.ring=1;$('fx').appendChild(c);}

  if(t.type==='action'){I.innerHTML=`<button class="big" id="act">▶ ${t.btn}</button>`;$('act').onclick=async()=>{$('act').disabled=true;await t.run();solved(t);};}
  if(t.type==='choice'){I.innerHTML='<div class="choices">'+shuffle(t.opts).map((o,k)=>`<button class="choice" data-ok="${o[1]}" data-k="${k}">${o[0]}</button>`).join('')+'</div>';
    const opts=shuffle; I.querySelectorAll('.choice').forEach(b=>b.onclick=async()=>{if(done)return;const o=t.opts.find(x=>x[0]===b.textContent);
      if(o[1]){b.classList.add('right');solved(t,o[2]);if(t.after)await t.after();}else{b.classList.add('wrong');miss(t,o[2]);}});}
  if(t.type==='text'){I.innerHTML=`<textarea id="ta" placeholder="${t.ph}">${guess}</textarea><button class="big" id="save" style="margin-top:10px">Verdacht speichern</button>`;
    $('save').onclick=()=>{const v=$('ta').value.trim();if(v.length<3){fb('no','Schreib wenigstens einen kurzen Satz auf.');return;}guess=v;solved(t,'Verdacht notiert! Jetzt beginnt die Spurensuche.');};}
  if(t.type==='tapImage'){stage('img','b4');I.innerHTML='<p class="caption">👆 Tippe direkt ins Bild.</p>';
    imgHandler=e=>{if(done)return;const r=$('stageImg').getBoundingClientRect();const fx=(e.clientX-r.left)/r.width,fy=(e.clientY-r.top)/r.height;const g=t.region;
      if(fx>=g[0]&&fx<=g[2]&&fy>=g[1]&&fy<=g[3]){mark(fx,fy,true);solved(t);}else{mark(fx,fy,false);miss(t,t.no);}};}
  if(t.type==='tapMol'){I.innerHTML='<p class="caption">👆 Tippe im Bild auf ein Atom oder eine Bindung.</p>';
    molHandler=async e=>{if(done)return;const p=svgPoint($('mol'),e);const h=hit(p);if(!h)return;
      const pos=cur.atoms[h]?atomP(h):bondMid(h);
      if(t.correct.includes(h)){pulseAt(pos[0],pos[1]);[...$('fx').querySelectorAll('[data-ring]')].forEach(r=>r.remove());solved(t);if(t.after)await t.after(h);}
      else{pulseAt(pos[0],pos[1],true);miss(t,'Du hast '+(NAMES[h]||'etwas anderes')+' angetippt. '+(t.wrong[h]||t.wrong._||''));}};}
  if(t.type==='place'){I.innerHTML='<div class="chips">'+t.chips.map(c=>`<button class="chip" data-c="${c}">${c}</button>`).join('')+'</div><p class="caption">1. Ladung antippen &nbsp;→&nbsp; 2. Br-Atom im Bild antippen</p>';
    let sel=null,placed={};
    I.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{if(b.classList.contains('used'))return;I.querySelectorAll('.chip').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');sel=b.dataset.c;});
    molHandler=async e=>{if(done)return;const p=svgPoint($('mol'),e);const h=hit(p);if(!h)return;
      if(!sel){fb('tip','Tippe zuerst auf δ+ oder δ–.');return;}
      if(h!=='BrA'&&h!=='BrB'){miss(t,'Die Partialladungen gehören zu den beiden Br-Atomen.');return;}
      if(t.sol[sel]===h){placed[sel]=1;const lab=sel==='δ+'?{dA:SC.polL.labels.dA}:{dB:SC.polL.labels.dB};cur.labels={...cur.labels,...lab};render(cur);
        pulseAt(cur.atoms[h].x,cur.atoms[h].y);I.querySelector(`[data-c="${sel}"]`).classList.add('used');I.querySelector(`[data-c="${sel}"]`).classList.remove('sel');sel=null;
        if(Object.keys(placed).length===2)solved(t);else fb('ok','Richtig platziert! Jetzt die zweite Ladung.');}
      else{pulseAt(cur.atoms[h].x,cur.atoms[h].y,true);miss(t,sel==='δ+'?'An diesem Br-Atom sammeln sich gerade die Elektronen – das wird eher negativ.':'Von diesem Br-Atom wurden die Elektronen weggedrückt.');}};}
  if(t.type==='order'){const items=shuffle(t.items);let n=0;I.innerHTML='<div class="choices order">'+items.map(x=>`<button class="choice">${x}</button>`).join('')+'</div>';
    I.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{if(done||b.classList.contains('right'))return;
      if(b.textContent===t.items[n]){n++;b.classList.add('right');b.innerHTML=`<span class="num">${n}</span>`+t.items[n-1];if(n===3)solved(t);}
      else{b.classList.add('wrong');setTimeout(()=>b.classList.remove('wrong'),700);miss(t,'Das ist nicht Schritt '+(n+1)+'.');if(tries>=3){fb('no','<b>Hilfe:</b> Schritt '+(n+1)+' ist: „'+t.items[n]+'“');}}});}
  if(t.type==='cloze'){let selGap=null;const fill={};
    I.innerHTML='<div class="cloze">'+t.parts.map(p=>typeof p==='number'?`<span class="gap" data-g="${p}">&nbsp;</span>`:p).join('')+'</div><div class="chips" id="bank">'+shuffle([...t.answers,...t.extra]).map(w=>`<button class="chip word">${w}</button>`).join('')+'</div><button class="big" id="check" style="margin-top:12px">Prüfen</button>';
    const gaps=[...I.querySelectorAll('.gap')];const selectGap=g=>{gaps.forEach(x=>x.classList.remove('sel'));selGap=g;if(g)g.classList.add('sel');};selectGap(gaps[0]);
    gaps.forEach(g=>g.onclick=()=>{if(done)return;if(fill[g.dataset.g]){fill[g.dataset.g]=null;g.innerHTML='&nbsp;';g.classList.remove('right','wrongg');}selectGap(g);});
    I.querySelectorAll('#bank .chip').forEach(w=>w.onclick=()=>{if(done||!selGap)return;fill[selGap.dataset.g]=w.textContent;selGap.textContent=w.textContent;selGap.classList.remove('wrongg');
      const nextEmpty=gaps.find(g=>!fill[g.dataset.g]);selectGap(nextEmpty||null);});
    $('check').onclick=()=>{if(done)return;let ok=0;gaps.forEach(g=>{const i=+g.dataset.g;if(fill[i]===t.answers[i]){ok++;g.classList.add('right');}else if(fill[i])g.classList.add('wrongg');});
      if(ok===t.answers.length)solved(t);else{miss(t,ok+' von '+t.answers.length+' Lücken stimmen. Tippe falsche Lücken an, um sie zu leeren.');if(tries>=3){gaps.forEach(g=>{const i=+g.dataset.g;fill[i]=t.answers[i];g.textContent=t.answers[i];g.classList.remove('wrongg');g.classList.add('right')});solved(t,'Hier ist der vollständige Merksatz – schreib ihn in dein Heft.');}}};}
}
function next(){const s=STATIONS[si];if(ti<s.tasks.length-1){ti++;startTask();return;}stationDone();}
function stationDone(){const s=STATIONS[si];if(!evidence.includes(s.evidence))evidence.push(s.evidence);progressUI();molHandler=null;imgHandler=null;
  const last=si===STATIONS.length-1;
  if(last){finalScreen();return;}
  panel(`<div class="kicker">${s.kicker}</div><h2>🗂️ Beweisstück gesichert!</h2><div class="evid">${s.evidence}</div>
    ${s.book?'<button class="bookbtn" id="book">📖 Mit dem Buch vergleichen (S. 58/59)</button>':''}
    <div class="actions"><button id="nextBtn" style="background:var(--amb)">${si===0?'Spurensuche starten →':'Nächste Spur →'}</button></div>`);
  if(s.book)$('book').onclick=()=>showBook(s);
  $('nextBtn').onclick=()=>startStation(si+1);}
function showBook(s){sheet(`<button class="close" onclick="closeSheet()">Schließen ✕</button><h3>So steht es im Buch</h3><p class="caption">${s.kicker} – Chemie Realschule Bayern 10 I, S. 58/59</p><img src="${IMG[s.book]}" alt="Abbildung aus dem Buch: ${s.title}"><p>Vergleiche: Stimmen deine Pfeile und Ladungen mit der Abbildung überein?</p>`);}
function sheet(h){$('sheet').innerHTML=h;$('overlay').classList.remove('hidden');}
window.closeSheet=()=>$('overlay').classList.add('hidden');
$('overlay').addEventListener('pointerdown',e=>{if(e.target.id==='overlay')closeSheet();});
$('notesBtn').onclick=()=>sheet(`<button class="close" onclick="closeSheet()">Schließen ✕</button><h3>🗂️ Notizbuch</h3>`+(guess?`<div class="evid"><b>Mein Verdacht:</b> ${esc(guess)}</div>`:'')+(evidence.length?evidence.map(e=>`<div class="evid">${e}</div>`).join(''):'<p class="caption">Noch keine Beweisstücke. Löse die Aufgaben, um Spuren zu sichern!</p>'));
$('restartBtn').onclick=()=>sheet(`<h3>Von vorn beginnen?</h3><p>Dein Fortschritt und dein Notizbuch werden gelöscht.</p><div class="actions"><button style="background:var(--light)" onclick="closeSheet()">Abbrechen</button><button style="background:var(--amb);color:#fff" onclick="closeSheet();restart()">Neustart</button></div>`);
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
window.restart=()=>{evidence=[];guess='';startStation(0);};
function finalScreen(){si=STATIONS.length;progressUI();stage('tube');resetTube();{const l=$('liq');l.style.transition='none';l.setAttribute('fill','#E6F1F3');l.getBoundingClientRect();l.style.transition='';}$('tubeLbl').textContent='farblos – Fall gelöst!';$('tubeLbl').style.fill='#2A9D8F';stageHint('');
  panel(`<div class="final"><div class="kicker">Akte geschlossen</div><h2>🎉 Fall gelöst!</h2>
   ${guess?`<div class="evid"><b>Dein Verdacht am Anfang:</b> ${esc(guess)}<br><i>Lagst du richtig? Was würdest du jetzt ergänzen?</i></div>`:''}
   <h3>Deine Beweisstücke</h3>${evidence.slice(1).map(e=>`<div class="evid">${e}</div>`).join('')}
   <img src="${IMG.gesamt}" alt="Gesamtgleichung Ethen plus Brom zu 1,2-Dibromethan" style="width:100%;border-radius:10px;border:1px solid var(--line);margin:8px 0">
   <div class="evid" style="background:#FDF6DC"><b>⭐ Profi-Fall:</b> Auch Propen (CH₂=CH–CH₃) entfärbt Bromwasser. Stelle den Reaktionsmechanismus in drei Schritten in deinem Heft auf und benenne das Produkt.</div>
   <div class="actions"><button style="background:var(--light)" id="again">↺ Nochmal</button><button style="background:var(--dark);color:#fff" id="nb">🗂️ Notizbuch</button></div></div>`);
  $('again').onclick=()=>restart();$('nb').onclick=()=>$('notesBtn').onclick();}
startStation(0);
</script>
</body>
